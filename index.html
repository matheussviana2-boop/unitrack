<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UniTrack">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>UniTrack — Rastreamento</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>


<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --teal:#0ab5a8;--teal-d:#079189;
  --navy:#0e1c2f;--navy2:#132438;--navy3:#1a3050;--navy4:#1f3a5f;
  --red:#e63329;
  --border:#1e3a58;--border2:#254d70;
  --text:#d4e8f5;--text2:#7ba5c0;--text3:#4a7090;
  --green:#00d46a;--yellow:#f5a623;--gray-st:#5a7a8a;
  --card-bg:#0e1c2f;--sidebar-bg:#0b1825;--topbar-bg:#091420;
  --r:10px;--r2:14px;
}
html,body{height:100%;font-family:'Exo 2',sans-serif;background:var(--navy);color:var(--text);overflow:hidden;}
/* iOS Safari fix: usar -webkit-fill-available para altura correta */
@supports (-webkit-touch-callout: none){
  html,body{height:-webkit-fill-available;}
  .app{height:-webkit-fill-available;}
}
.app{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;}
.body{display:flex;flex:1;overflow:hidden;}

/* ── TOPBAR ── */
.topbar{
  background:var(--topbar-bg);border-bottom:1px solid var(--border);
  padding:0 18px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;gap:12px;
  box-shadow:0 2px 16px rgba(0,0,0,0.4);z-index:500;position:relative;
}
.logo-wrap{display:flex;align-items:center;gap:12px;}
.logo-divider{width:1px;height:26px;background:var(--border2);}
.logo-sub{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase;}
.topbar-center{display:flex;align-items:center;gap:8px;}
.stat-chip{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid;}
.sc-g{background:rgba(0,212,106,0.1);color:#00d46a;border-color:rgba(0,212,106,0.25);}
.sc-y{background:rgba(245,166,35,0.1);color:#f5a623;border-color:rgba(245,166,35,0.25);}
.sc-d{background:rgba(90,122,138,0.12);color:#5a7a8a;border-color:rgba(90,122,138,0.25);}
.sc-dot{width:7px;height:7px;border-radius:50%;}
.sc-g .sc-dot{background:#00d46a;box-shadow:0 0 5px #00d46a;}
.sc-y .sc-dot{background:#f5a623;box-shadow:0 0 5px #f5a623;}
.sc-d .sc-dot{background:#5a7a8a;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.clock{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--teal);letter-spacing:1px;}
.clock-date{font-size:9px;color:var(--text3);letter-spacing:1px;margin-top:0;}
.cd-pill{display:flex;align-items:center;gap:5px;background:rgba(10,181,168,0.1);border:1px solid rgba(10,181,168,0.25);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:600;color:var(--teal);}
.btn-refresh{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--teal-d),var(--teal));color:white;border:none;padding:7px 15px;border-radius:8px;cursor:pointer;font-family:'Exo 2',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.5px;transition:opacity 0.2s,transform 0.1s;box-shadow:0 2px 10px rgba(10,181,168,0.3);}
.btn-refresh:hover{opacity:0.88;}
.btn-refresh:active{transform:scale(0.97);}
.btn-refresh.sp .rf-icon{animation:spin 0.7s linear infinite;}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

/* ── PROGRESS ── */
.rfbar{height:2px;background:var(--navy3);flex-shrink:0;overflow:hidden;}
.rfprog{height:100%;background:linear-gradient(90deg,var(--navy4),var(--teal),var(--teal-d));background-size:200%;animation:shimmer 2s linear infinite;transition:width 1s linear;}

.leaflet-control-zoom{display:none!important;}

/* ── SIDEBAR ── */
.sidebar{width:296px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:visible;flex-shrink:0;box-shadow:3px 0 16px rgba(0,0,0,0.3);}
.sb-head{padding:12px 14px 10px;border-bottom:1px solid var(--border);background:var(--topbar-bg);flex-shrink:0;overflow:visible;position:relative;z-index:99999;}
.sb-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sb-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}
.sb-count{font-size:10px;font-weight:700;color:var(--teal);font-family:'Space Mono',monospace;}

/* autocomplete */
.ac-wrap{position:relative;width:100%;}
.ac-input{width:100%;background:var(--navy3);border:1.5px solid var(--border);color:var(--text);font-family:'Exo 2',sans-serif;font-size:12px;font-weight:500;padding:7px 28px 7px 30px;border-radius:8px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.ac-input::placeholder{color:var(--text3);}
.ac-input:hover{border-color:rgba(10,181,168,0.4);}
.ac-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,181,168,0.12);}
.ac-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;}
.ac-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--text3);cursor:pointer;font-size:15px;line-height:1;display:none;}
.ac-clear:hover{color:var(--text);}
.ac-clear.show{display:block;}
.ac-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:99999;background:var(--navy2);border:1px solid var(--border2);border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.7);display:none;max-height:220px;overflow-y:auto;animation:dropIn 0.15s ease;}
.ac-dropdown.open{display:block;}
/* Mobile: position:fixed para escapar do overflow:hidden da sidebar */
.ac-dropdown.fixed-drop{position:fixed!important;left:0!important;right:auto!important;top:auto!important;}
.ac-dropdown::-webkit-scrollbar{width:3px;}
.ac-dropdown::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.ac-item{padding:9px 12px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;transition:background 0.1s;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;gap:8px;}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.sel{background:rgba(10,181,168,0.12);color:var(--teal);}
.ac-item mark{background:rgba(10,181,168,0.22);color:var(--teal);border-radius:2px;font-style:normal;padding:0 1px;}
.ac-group-label{padding:6px 12px 4px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);background:rgba(0,0,0,0.2);}
.ac-empty{padding:12px;font-size:11px;color:var(--text3);text-align:center;}

/* grupo separador na lista */
.list-group-hdr{
  padding:6px 14px;font-size:9px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--text3);
  background:var(--sidebar-bg);border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.04);
  position:sticky;top:0;z-index:2;
  /* Avoid overlapping stickies: each header stacks below the previous */
}
.list-group-hdr:first-child{border-top:none;}

.sb-list{flex:1;overflow-y:auto;}
.sb-list::-webkit-scrollbar{width:3px;}
.sb-list::-webkit-scrollbar-track{background:var(--navy2);}
.sb-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.sb-list::-webkit-scrollbar-thumb:hover{background:var(--teal);}

/* ── VEHICLE ITEM ── */
.vi{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;gap:9px;cursor:pointer;transition:background 0.12s;border-left:3px solid transparent;}
.vi:hover{background:rgba(10,181,168,0.07);}
.vi.act{background:rgba(10,181,168,0.12);border-left-color:var(--teal);}
.vi-icon{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.vig-g{background:rgba(0,212,106,0.08);border:2px solid rgba(0,212,106,0.5);}
.vig-y{background:rgba(245,166,35,0.08);border:2px solid rgba(245,166,35,0.5);}
.vig-d{background:rgba(90,122,138,0.08);border:2px solid rgba(90,122,138,0.4);}
.vi-info{flex:1;min-width:0;}
.vi-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vi-sub{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.vi-right{text-align:right;flex-shrink:0;}
.vi-spd{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--teal);}
.vi-spd-u{font-size:8px;color:var(--text3);}
.vi-badge{display:inline-block;margin-top:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;}
.vb-g{background:rgba(0,212,106,0.15);color:#00d46a;}
.vb-y{background:rgba(245,166,35,0.15);color:#f5a623;}
.vb-d{background:rgba(90,122,138,0.15);color:#5a7a8a;}
.sb-empty{padding:24px 14px;text-align:center;color:var(--text3);font-size:12px;}
/* ── LINHA BADGE (sidebar + card) ── */
.vi-linha-wrap{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap;}
.vi-linha-nome{font-size:9px;font-weight:700;letter-spacing:0.3px;color:var(--teal);white-space:normal;word-break:break-word;line-height:1.3;}
.vi-linha-st{font-size:8px;font-weight:700;padding:1px 6px;border-radius:8px;flex-shrink:0;}
.vl-on .vi-linha-st{background:rgba(0,212,106,0.15);color:#00d46a;}
.vl-off .vi-linha-st{background:rgba(90,122,138,0.15);color:#5a7a8a;}
.vi-linha-wrap.vl-on .vi-linha-nome{color:var(--teal);}
.vi-linha-wrap.vl-off .vi-linha-nome{color:#5a7a8a;}
/* Linha no info-card */
.ic-linha-row{display:flex;flex-direction:column;gap:4px;padding:7px 10px;border-radius:7px;background:rgba(10,181,168,0.06);border:1px solid rgba(10,181,168,0.15);margin-bottom:7px;}
.ic-linha-top{display:flex;align-items:center;gap:7px;}
.ic-linha-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ic-linha-nome{font-size:11px;font-weight:700;color:var(--teal);line-height:1.35;word-break:break-word;white-space:normal;}
.ic-linha-bot{display:flex;align-items:center;justify-content:flex-end;}
.ic-linha-st{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;}
.icls-on{background:rgba(0,212,106,0.15);color:#00d46a;}
.icls-off{background:rgba(90,122,138,0.15);color:#5a7a8a;}

/* ── MAP ── */
.map-area{flex:1;position:relative;overflow:hidden;}
#map{width:100%;height:100%;filter:brightness(1.0) saturate(1.0);}
.leaflet-container{background:#1a2a3a!important;}
.leaflet-control-zoom a{background:var(--navy2)!important;color:var(--teal)!important;border-color:var(--border)!important;}
.leaflet-control-zoom a:hover{background:var(--navy3)!important;}




/* Badge flutuante mobile (sobre o mapa) */
.mobile-badge-float{
  display:none; /* oculto no desktop */
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  z-index:500;
  background:rgba(9,20,32,0.92);border:1px solid var(--border2);
  border-radius:12px;padding:6px 12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  backdrop-filter:blur(4px);
  align-items:center;gap:10px;
  white-space:nowrap;
}
@media(max-width:700px){
  .mobile-badge-float{display:flex;}
}


.map-toggle{position:absolute;bottom:28px;right:12px;z-index:500;display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--border2);box-shadow:0 4px 16px rgba(0,0,0,0.5);}
.mt-btn{padding:7px 14px;font-size:11px;font-weight:700;font-family:'Exo 2',sans-serif;cursor:pointer;border:none;letter-spacing:0.5px;transition:background 0.2s,color 0.2s;display:flex;align-items:center;gap:5px;}
.mt-btn.active{background:var(--teal);color:white;}
.mt-btn:not(.active){background:rgba(9,20,32,0.9);color:var(--text3);}
.mt-btn:not(.active):hover{background:rgba(9,20,32,1);color:var(--text);}

/* Botão limpar seleção */
.btn-clear-sel{position:absolute;top:12px;left:12px;z-index:500;display:none;background:rgba(9,20,32,0.92);border:1px solid var(--border2);border-radius:8px;padding:7px 12px;font-size:11px;font-weight:700;font-family:'Exo 2',sans-serif;color:var(--text2);cursor:pointer;gap:6px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:background 0.15s;}
.btn-clear-sel.vis{display:flex;}
.btn-clear-sel:hover{background:rgba(9,20,32,1);color:var(--text);}

/* INFO CARD */
.info-card{position:absolute;z-index:600;width:260px;background:var(--card-bg);border:1px solid var(--border2);border-radius:var(--r2);box-shadow:0 8px 32px rgba(0,0,0,0.7),0 0 0 1px rgba(10,181,168,0.08);display:none;animation:slideUp 0.2s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.info-card.vis{display:block;}
.info-card::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:14px;height:7px;clip-path:polygon(0 0,100% 0,50% 100%);background:var(--border2);}
.info-card::before{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:12px;height:6px;clip-path:polygon(0 0,100% 0,50% 100%);background:var(--card-bg);z-index:1;}
.ic-stripe{height:3px;width:100%;}
.ic-stripe-g{background:linear-gradient(90deg,#00d46a,#00ff88);}
.ic-stripe-y{background:linear-gradient(90deg,#f5a623,#ffd600);}
.ic-stripe-d{background:linear-gradient(90deg,#5a7a8a,#90a4ae);}
.ic-body{padding:12px 13px 13px;}
.ic-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.ic-frota{font-size:14px;font-weight:800;color:#fff;letter-spacing:0.3px;}
.ic-moto{font-size:11px;font-weight:700;color:#c8dff0;margin-top:3px;letter-spacing:0.2px;}
.ic-close{width:20px;height:20px;border-radius:5px;cursor:pointer;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text3);font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s;}
.ic-close:hover{background:rgba(255,255,255,0.12);}
.ic-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px;}
.ic-f{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:7px;padding:7px 8px;}
.icf-l{font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.icf-v{font-size:12px;font-weight:700;color:var(--text);}
.icf-v.vg{color:#00d46a;}
.icf-v.vy{color:#f5a623;}
.icf-v.vd{color:#5a7a8a;}
.ic-sbar{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:7px;font-size:10px;font-weight:700;letter-spacing:0.3px;}
.isb-g{background:rgba(0,212,106,0.1);color:#00d46a;border:1px solid rgba(0,212,106,0.2);}
.isb-y{background:rgba(245,166,35,0.1);color:#f5a623;border:1px solid rgba(245,166,35,0.2);}
.isb-d{background:rgba(90,122,138,0.1);color:#5a7a8a;border:1px solid rgba(90,122,138,0.2);}
.isb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.isb-g .isb-dot{background:#00d46a;box-shadow:0 0 5px #00d46a;}
.isb-y .isb-dot{background:#f5a623;box-shadow:0 0 5px #f5a623;}
.isb-d .isb-dot{background:#5a7a8a;}

/* CLUSTER */
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:transparent!important;border:none!important;}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:transparent!important;}

/* OVERLAY */
.overlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.ov-load{background:rgba(8,16,26,0.95);}
.ov-err{background:rgba(8,16,26,0.97);}
.spin-ring{width:44px;height:44px;border-radius:50%;border:2px solid rgba(10,181,168,0.15);border-top-color:var(--teal);border-right-color:#1a3050;animation:spin 0.8s linear infinite;}
.ov-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text2);letter-spacing:1px;}
.ov-sub{font-size:11px;color:var(--text3);}
.er-box{background:var(--navy2);border:1px solid var(--border2);border-radius:var(--r2);padding:28px 32px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.6);max-width:320px;}
.er-ico{font-size:32px;margin-bottom:8px;}
.er-tt{font-size:14px;font-weight:800;color:var(--red);margin-bottom:6px;}
.er-sb{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:16px;}
.btn-retry{background:var(--teal);color:white;border:none;padding:8px 22px;border-radius:8px;cursor:pointer;font-family:'Exo 2',sans-serif;font-size:12px;font-weight:700;}
.btn-retry:hover{opacity:0.85;}
.hidden{display:none!important;}


/* ── SIDEBAR OVERLAY (desktop: hidden) ── */
.sb-overlay{display:none;}
/* ── btn-sb-toggle: hidden on desktop, shown on mobile via tb-mobile-only ── */
.btn-sb-toggle{display:none;}

/* ── TABLET ── */
@media(max-width:1024px) and (min-width:701px){
  .sidebar{width:260px;}
  .logo-sub,.logo-divider{display:none;}
}

/* ═══════════════════════════════════════
   MOBILE — TUDO QUE MUDA EM ≤700px
═══════════════════════════════════════ */

/* Utilitários de visibilidade */
.tb-desktop-only{display:flex;}
.tb-mobile-only{display:none;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

@media(max-width:700px){

  /* ── visibilidade ── */
  .tb-desktop-only{display:none!important;}
  .tb-mobile-only{display:flex!important;}

  /* ── topbar compacta ── */
  .topbar{
    height:50px;
    padding:0 10px;
    gap:8px;
  }
  /* hambúrguer à esquerda, logo no centro, botões à direita */
  .logo-wrap{flex:1;justify-content:flex-start;}
  .topbar-center{display:none!important;}
  .topbar-right{gap:8px;flex-shrink:0;}

  /* clock mobile */
  #clockMobile{
    font-family:'Space Mono',monospace;
    font-size:11px;font-weight:700;
    color:var(--teal);letter-spacing:0.5px;
    display:flex;align-items:center;
  }

  /* btn menu (hamburger) */
  .btn-sb-toggle{
    display:flex!important;
    align-items:center;justify-content:center;
    width:38px;height:38px;
    border-radius:10px;
    border:1px solid var(--border2);
    background:rgba(10,181,168,0.15);
    color:var(--teal);
    cursor:pointer;
    flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-sb-toggle:active{background:rgba(10,181,168,0.3);}

  /* btn refresh: só ícone */
  .btn-refresh{
    padding:0;
    width:38px;height:38px;
    border-radius:10px;

let pageVisible = !document.hidden;

document.addEventListener('visibilitychange', () => {
  pageVisible = !document.hidden;
  if(pageVisible){
    const bgTime = Date.now() - _bgTs;
    // Ficou mais de 30s em segundo plano → atualiza imediatamente
    if(bgTime > 30000 || cd <= 0){

      clearInterval(cdInt);

});

/* Watchdog: a cada 5s verifica se o countdown ainda está rodando.

/* ══════════════════════════════════════════════════════
   INTERPOLAÇÃO DE POSIÇÃO
   Anima o marcador do veículo selecionado suavemente
   entre posição anterior e nova.
   - Só ativa para veículos green
   - Distância > 2km → teleporta (falha de GPS)
   - Distância < 5m  → não anima (parado)
   - Ao selecionar: calcula ponto intermediário já
     percorrido com base no timestamp da transmissão
   Zero chamadas extras à API — puramente local.
══════════════════════════════════════════════════════ */

/* Distância Haversine em km entre dois pontos */
function _haversineKm(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)
    +Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)
    *Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* Para a interpolação em curso */
function stopInterp(){
  if(_interpInt){ clearInterval(_interpInt); _interpInt=null; }
  _interpFrom=null; _interpTo=null; _interpT0=null; _interpDur=null;
}

/* Inicia interpolação do marcador mk de (fromLat,fromLng) → (toLat,toLng)
   dur: duração em ms (padrão _INTERP_MS) — permite começar no meio do caminho */
/* Interpola ao longo dos pontos da rota OSRM
   dado t (0→1), retorna {lat,lng} no caminho real */
function _routePoint(t){
  if(!_routePts.length) return null;
  const d=t*_routeTotal;
  for(let i=0;i<_routeDists.length-1;i++){
    if(d<=_routeDists[i+1]){
      const seg=_routeDists[i+1]-_routeDists[i];
      const f=seg>0?(d-_routeDists[i])/seg:0;
      return {
        lat:_routePts[i].lat+(_routePts[i+1].lat-_routePts[i].lat)*f,
        lng:_routePts[i].lng+(_routePts[i+1].lng-_routePts[i].lng)*f
      };
    }
  }
  return _routePts[_routePts.length-1];
}

/* Inicia animação — tenta buscar rota OSRM, fallback para linha reta */
function startInterp(mk, fromLat, fromLng, toLat, toLng, dur){
  stopInterp();
  const dist=_haversineKm(fromLat,fromLng,toLat,toLng);
  // <30m ou >2km → não anima, só reposiciona (parado ou GPS com falha)
  if(dist<0.03 || dist>_MAX_INTERP_KM){
    mk.setLatLng([toLat,toLng]);
    return;
  }
  _interpFrom={lat:fromLat,lng:fromLng};
  _interpTo  ={lat:toLat,  lng:toLng};
  _interpT0  =Date.now();
  _interpDur =dur||_INTERP_MS;
  _routePts=[];_routeDists=[];_routeTotal=0;

  // OSRM só para distâncias >= 200m (abaixo disso linha reta é imperceptível)
  if(dist>=0.2){
    const osrmUrl='https://router.project-osrm.org/route/v1/driving/'
      +fromLng+','+fromLat+';'+toLng+','+toLat
      +'?overview=full&geometries=geojson';
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),3000);
    fetch(osrmUrl,{signal:ctrl.signal,cache:'no-store'})
      .then(r=>r.json())
      .then(data=>{
        clearTimeout(tid);
        const coords=data && data.routes && data.routes[0] && data.routes[0].geometry && data.routes[0].geometry.coordinates;
        if(!coords || coords.length<2) return;
        const pts=coords.map(c=>({lat:c[1],lng:c[0]}));
        let rd=[0];
        for(let i=1;i<pts.length;i++){
          rd.push(rd[i-1]+_haversineKm(pts[i-1].lat,pts[i-1].lng,pts[i].lat,pts[i].lng));
        }
        const rLen=rd[rd.length-1];
        // Filtro anti-looping: rejeita rota > 3x distância direta
        if(rLen>dist*3){
          console.warn('[OSRM] rejeitado: rota',rLen.toFixed(2)+'km vs direto',dist.toFixed(2)+'km');
          return;
        }
        _routePts=pts;_routeDists=rd;_routeTotal=rLen;
        console.log('[OSRM] ok',pts.length,'pts',rLen.toFixed(2)+'km');
      })
      .catch(e=>{ clearTimeout(tid); console.warn('[OSRM] falhou:',e&&e.message); });
  }

  if(activeV) startTrail(fromLat, fromLng);

  _interpInt=setInterval(()=>{
    const t=Math.min((Date.now()-_interpT0)/_interpDur,1);
    let lat,lng;
    if(_routePts.length>=2){
      const pt=_routePoint(t);
      lat=pt.lat; lng=pt.lng;
    } else {
      lat=_interpFrom.lat+(_interpTo.lat-_interpFrom.lat)*t;
      lng=_interpFrom.lng+(_interpTo.lng-_interpFrom.lng)*t;
    }
    mk.setLatLng([lat,lng]);
    if(activeV) updateTrail(lat,lng);
    if(t>=1) stopInterp();
  },100); // 10fps — suave no mobile, leve no processamento
}

/* ══════════════════════════════════════════════════════
   RASTRO DO VEÍCULO
   - Linha "viva" que cresce junto com a animação
   - Mantém apenas as 2 últimas transmissões
   - Segmento anterior: opacidade 0.35 (apagado)
   - Segmento atual (animando): opacidade 1.0 (vivo)
   - Some ao desselecionar
══════════════════════════════════════════════════════ */

/* Remove tudo do rastro do mapa */
function clearTrail(){
  if(trailLayer) trailLayer.clearLayers();
  _trailLine=null;
  _trailLines=[];
  _trailPts=[];
}

/* Inicia nova linha viva do ponto fromLat/Lng
   Chamado no início de cada animação */
function _ensureTrailLayer(){
  // Inicialização defensiva — garante que trailLayer existe mesmo se initMap demorou
  if(trailLayer) return;
  if(!mapL) return;
  if(!mapL.getPane('trailPane')){
    mapL.createPane('trailPane');
    mapL.getPane('trailPane').style.zIndex = 350;
    mapL.getPane('trailPane').style.pointerEvents = 'none';
  }
  _trailRenderer = L.svg({pane:'trailPane'});
  trailLayer = L.layerGroup([], {pane:'trailPane'}).addTo(mapL);
}

/* ══════════════════════════════════════════════════════
   RASTRO COM JANELA DESLIZANTE DE 5 SEGUNDOS
   - Cada ponto tem timestamp
   - Pontos com idade > 5s são removidos automaticamente
   - Rastro nunca fica longo nem polui o mapa
   - Reconstrói polyline a cada tick (mais confiável no mobile)
══════════════════════════════════════════════════════ */

const _TRAIL_WINDOW_MS = 5000; // mantém só os últimos 5s de movimento

function startTrail(fromLat, fromLng){
  _ensureTrailLayer();
  if(!trailLayer) return;
  // Limpa rastro anterior completamente
  if(_trailLine){ trailLayer.removeLayer(_trailLine); _trailLine=null; }
  if(trailLayer.clearLayers) trailLayer.clearLayers();
  _trailLines=[];
  // Inicia novo array com timestamp
  _trailPts=[{lat:fromLat, lng:fromLng, ts:Date.now()}];
  _trailLine = L.polyline(
    [[fromLat, fromLng]],
    {color:'#00e676', weight:3, opacity:0.6, lineCap:'round', lineJoin:'round',
     pane:'trailPane', renderer:_trailRenderer}
  ).addTo(trailLayer);
}

function updateTrail(lat, lng){
  if(!_trailLine || !trailLayer) return;
  const now = Date.now();
  const last = _trailPts[_trailPts.length-1];
  // Filtra pontos muito próximos (~5m)
  if(last){
    const dlat=Math.abs(lat-last.lat), dlng=Math.abs(lng-last.lng);
    if(dlat<0.00005 && dlng<0.00005){
      // Mesmo sem novo ponto, remove pontos antigos da janela
      const cutoff = now - _TRAIL_WINDOW_MS;
      const before = _trailPts.length;
      _trailPts = _trailPts.filter(p => p.ts >= cutoff);
      if(_trailPts.length !== before){
        _redrawTrail();
      }
      return;
    }
  }
  // Adiciona novo ponto
  _trailPts.push({lat, lng, ts:now});
  // Remove pontos fora da janela de 5s
  const cutoff = now - _TRAIL_WINDOW_MS;
  _trailPts = _trailPts.filter(p => p.ts >= cutoff);
  _redrawTrail();
}

function _redrawTrail(){
  if(!_trailLine || !trailLayer) return;
  trailLayer.removeLayer(_trailLine);
  if(_trailPts.length < 1) return;
  const latlngs = _trailPts.map(p => [p.lat, p.lng]);
  _trailLine = L.polyline(
    latlngs,
    {color:'#00e676', weight:3, opacity:0.6, lineCap:'round', lineJoin:'round',
     pane:'trailPane', renderer:_trailRenderer}
  ).addTo(trailLayer);
}

/* ── STATUS ── */
function getStatus(v){
  var dh=v.datahora;
  var d=parseData(dh);
  if(!d){
    // Sem data ou data inválida = sem sinal
    return 'dark';
  }
  var now=new Date();
  // Sem sinal: última transmissão NÃO foi no dia de hoje
  var isToday=(
    d.getFullYear()===now.getFullYear()&&
    d.getMonth()===now.getMonth()&&
    d.getDate()===now.getDate()
  );
  if(!isToday) return 'dark';
  // Transmitindo hoje — verifica ignição
  var ig=(v.ignicao||'').toString().toLowerCase().trim();
  if(['1','true','ligado','on','s','sim'].includes(ig)) return 'green';
  return 'yellow';
}
const ST_COLOR={green:'#00d46a',yellow:'#f5a623',dark:'#5a7a8a'};

/* ── NORMALIZE ── */
function norm(arr){
  // Debug: loga o primeiro item para identificar campos reais da API
  if(arr.length>0){
    console.log('[UniTrack] API campos do 1o item:', JSON.stringify(arr[0]));
  }

  // Pega o valor do primeiro campo encontrado numa lista de candidatos
  function pick(obj, keys){
    for(var i=0;i<keys.length;i++){
      var v=obj[keys[i]];
      if(v!==undefined&&v!==null&&v!==''){return String(v).trim();}
    }
    return '';
  }

  return arr.filter(function(x){
    var la=parseFloat(x.latitude||x.lat||x.latitudeatual||x.Latitude||x.LAT||0);
    var lo=parseFloat(x.longitude||x.lng||x.lon||x.longitudeatual||x.Longitude||x.LON||0);
    return la!==0&&lo!==0&&!isNaN(la)&&!isNaN(lo);
  }).map(function(x,i){
    // frota / placa / identificação do veículo
    var frota=pick(x,[
      'frota','placa','veiculo','veiculo_id','vei','prefixo',
      'codigo','descricao','nome','nome_veiculo','identificacao',
      'Frota','Placa','Veiculo','Prefixo','CodigoVeiculo','codigo_veiculo'
    ]);
    if(!frota) frota='VEI-'+(i+1);

    // motorista
    var motorista=pick(x,[
      'motorista','condutor','driver','nome_motorista','nomeMotorista',
      'motorista_nome','Motorista','NomeMotorista','nome_condutor','NomeCondutor'
    ]);
    if(!motorista) motorista='—';

    // data/hora
    var datahora=pick(x,[
      'datahora','data_hora','dataHora','data','datetime','dt',
      'timestamp','ultima_posicao','DataHora','Datahora','dthr','dtHr',
      'data_transmissao','DataTransmissao'
    ]);

    // ignição
    var ignicao=pick(x,[
      'ignicao','ignição','ignition','ignicao_atual','IgnicaoAtual',
      'Ignicao','status_ignicao','statusIgnicao','motor','Motor'
    ]);

    // velocidade
    var velocidade=parseFloat(
      x.velocidade||x.speed||x.vel||x.Velocidade||x.SPEED||0
    )||0;

    // hodômetro
    var hodometro=pick(x,[
      'hodometro','odometro','km','hodometro_total','HodometroTotal',
      'Hodometro','Odometro','KM','odometer','horimetro'
    ]);
    if(!hodometro) hodometro='—';

    // lat/lng
    var lat=parseFloat(x.latitude||x.lat||x.latitudeatual||x.Latitude||x.LAT);
    var lng=parseFloat(x.longitude||x.lng||x.lon||x.longitudeatual||x.Longitude||x.LON);

    return {
      id: x.id||x.codigo||x.equipamento||x.imei||x.Id||x.ID||i,
      frota: frota,
      motorista: motorista,
      setor: pick(x,['setor','grupo','empresa','filial','cliente','Setor','Empresa'])||'—',
      datahora: datahora,
      ignicao: ignicao,
      velocidade: velocidade,
      hodometro: hodometro,
      lat: lat,
      lng: lng,
    };
  });
}

/* ══════════════════════════════════════════
   ORDENAÇÃO:
   1. Transmitindo + Ligado (green) A-Z
   2. Transmitindo + Parado (yellow) A-Z
   3. Sem sinal +24h (dark) A-Z
══════════════════════════════════════════ */
function sortVehicles(arr){
  const green =arr.filter(v=>getStatus(v)==='green' ).sort((a,b)=>a.frota.localeCompare(b.frota,'pt-BR'));
  const yellow=arr.filter(v=>getStatus(v)==='yellow').sort((a,b)=>a.frota.localeCompare(b.frota,'pt-BR'));
  const dark  =arr.filter(v=>getStatus(v)==='dark'  ).sort((a,b)=>a.frota.localeCompare(b.frota,'pt-BR'));
  return{green,yellow,dark};
}

      d.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${on?'#0ab5a8':'#5a7a8a'}" stroke-width="2"><rect x="2" y="7" width="20" height="13" rx="3"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><circle cx="8.5" cy="14" r="1.5"/><circle cx="15.5" cy="14" r="1.5"/></svg><span>${highlight(nome,q)}</span>${st?`<span style="font-size:8px;font-weight:700;padding:1px 5px;border-radius:8px;background:${on?'rgba(0,212,106,0.15)':'rgba(90,122,138,0.15)'};color:${on?'#00d46a':'#5a7a8a'};margin-left:4px;">${st}</span>`:''}`;
      d.dataset.val=nome;d.dataset.type='linha';
      d.onmousedown=(e)=>{e.preventDefault();acSelect(nome,'linha');};
      drop.appendChild(d);
    });
  }
  _acDropOpen(drop);
}
function acSelect(val,type){
  document.getElementById('acInput').value=val;
  const _d=document.getElementById('acDrop');
  _d.classList.remove('open');
  _d.classList.remove('fixed-drop');
  _d.style.cssText='';
  document.getElementById('acClear').classList.add('show');
  searchQ=val.toLowerCase();
  renderList();
  if(type==='frota'){
    const v=allV.find(x=>x.frota===val);
    if(v)selectVehicle(v,false);
  }else if(type==='motorista'){
    const v=allV.find(x=>x.motorista===val);
    if(v)selectVehicle(v,false);
  }else if(type==='linha'){
    // Seleciona o primeiro veículo que esteja nessa linha
    const v=allV.find(x=>{ const li=linhaMap[x.frota]; return li&&li.nomeLinha===val; });
    if(v)selectVehicle(v,false);
  }
}
function acClear(){
  document.getElementById('acInput').value='';
  const _dd=document.getElementById('acDrop');
  _dd.classList.remove('open');
  _dd.classList.remove('fixed-drop');
  _dd.style.cssText='';
  document.getElementById('acClear').classList.remove('show');
  searchQ='';selIdx=-1;
  renderList();clearSelection();
}
function acKey(e){
  const drop=document.getElementById('acDrop');
  const items=drop.querySelectorAll('.ac-item');
  if(!items.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();selIdx=Math.min(selIdx+1,items.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();selIdx=Math.max(selIdx-1,0);}
  else if(e.key==='Enter'&&selIdx>=0){items[selIdx].onmousedown(e);return;}
  else if(e.key==='Escape'){drop.classList.remove('open');return;}
  items.forEach((i,x)=>i.classList.toggle('sel',x===selIdx));
}
document.addEventListener('mousedown',(e)=>{
  if(!document.getElementById('acWrap').contains(e.target))
    document.getElementById('acDrop').classList.remove('open');
});

/* ── RENDER MARKERS ── */
function renderMkrs(highlightId=null){
  cluster.clearLayers();
  singleLayer.clearLayers();
  mkrs={};
  if(highlightId!==null){
    // Exibe apenas o veículo selecionado — sem os demais ao redor
    const vSel=filt.find(v=>String(v.id)===String(highlightId));
    if(vSel){
      const st=getStatus(vSel);const color=ST_COLOR[st];
      const icon=busMapIcon(color,true,false);
      const curLat=(_interpFrom&&_interpTo)?_interpFrom.lat+(_interpTo.lat-_interpFrom.lat)*Math.min((Date.now()-_interpT0)/_interpDur,1):vSel.lat;
      const curLng=(_interpFrom&&_interpTo)?_interpFrom.lng+(_interpTo.lng-_interpFrom.lng)*Math.min((Date.now()-_interpT0)/_interpDur,1):vSel.lng;
      const m=L.marker([curLat,curLng],{icon,zIndexOffset:1000});
      m.on('click',()=>selectVehicle(vSel,true));
      singleLayer.addLayer(m);mkrs[vSel.id]=m;
    }
  }else{
    filt.forEach(v=>{
      const st=getStatus(v);const color=ST_COLOR[st];
      const m=L.marker([v.lat,v.lng],{icon:busMapIcon(color,false,false)});
      m.on('click',()=>selectVehicle(v,true));
      cluster.addLayer(m);mkrs[v.id]=m;
    });
  }
}

/* ── SELECT VEHICLE ── */
/* fromMap=true  → clique no marcador do mapa → sempre abre o card
   fromMap=false → clique na lista/autocomplete → se já selecionado, deseleciona */
function selectVehicle(v, fromMap){
  const isSame = activeV && String(activeV.id) === String(v.id);
  const card = document.getElementById('iCard');

  if(isSame && !fromMap){
    // Mesmo veículo clicado novamente na lista → deseleciona e mostra todos
    clearSelection();
    return;
  }

  if(isSame && fromMap){
    // Mesmo veículo clicado no marcador → reabre o card sem mexer no rastro/animação
    if(!card.classList.contains('vis')){
      mapL.flyTo([v.lat,v.lng],17,{animate:true,duration:0.9});
      setTimeout(()=>positionCard(v), 950);
    } else {
      card.classList.remove('vis');
    }
    return;
  }

  // Novo veículo selecionado
  activeV = v;
  stopInterp();
  clearTrail(); // limpa rastro do veículo anterior imediatamente
  document.querySelectorAll('.vi').forEach(e=>e.classList.remove('act'));
  const li = document.getElementById(`li-${v.id}`);
  if(li){li.classList.add('act');li.scrollIntoView({behavior:'smooth',block:'nearest'});}
  document.getElementById('btnClearSel').classList.add('vis');
  renderMkrs(v.id);
  card.classList.remove('vis');
  mapL.flyTo([v.lat,v.lng],17,{animate:true,duration:0.9});
  // Inicia rastro sem mover marcador para trás
  setTimeout(()=>{
    const mk=mkrs[v.id];
    if(mk && getStatus(v)==='green' && activeV) startTrail(v.lat, v.lng);
    positionCard(v);
  }, 950);
  closeSidebarIfMobile();
}

/* ── FORMAT DATE ── */
/* Parser robusto de data — suporta todos os formatos comuns da API */
function parseData(dh){
  if(!dh||dh==='—') return null;
  var s=String(dh).trim();
  if(!s) return null;
  var d;
  // Formato ISO: 2026-03-28T03:11:00 ou 2026-03-28 03:11:00
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    d=new Date(s.replace(' ','T'));
    if(!isNaN(d)) return d;
  }
  // Formato BR: 28/03/2026 03:11:00 ou 28/03/26 03:11
  var m=s.match(/^(\d{2})\/(\d{2})\/(\d{2,4})(?:[\s T](\d{2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    var day=parseInt(m[1]),mon=parseInt(m[2])-1;
    var yr=parseInt(m[3]);
    if(yr<100) yr+=2000;
    var hr=m[4]?parseInt(m[4]):0, mn=m[5]?parseInt(m[5]):0, sc=m[6]?parseInt(m[6]):0;
    d=new Date(yr,mon,day,hr,mn,sc);
    if(!isNaN(d)) return d;
  }
  // Timestamp numérico
  if(/^\d{10,13}$/.test(s)){
    var ts=parseInt(s);
    if(s.length===10) ts*=1000;
    d=new Date(ts);
    if(!isNaN(d)) return d;
  }
  // Último recurso
  d=new Date(s);
  return isNaN(d)?null:d;
}

function fmtDt(dh){
  if(!dh||dh==='—') return '—';
  var d=parseData(dh);
  if(!d) return String(dh);
  return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── RENDER LIST ── */
function renderList(){
  const b=document.getElementById('listBody');b.innerHTML='';

    if(v.frota.toLowerCase().includes(q))return true;

  }):allV;

      el.id=`li-${v.id}`;
      const linfo=linhaMap[v.frota]||null;
      const lBadge=linfo&&linfo.nomeLinha
        ? (() => {
            const on=linfo.statusLinha&&!['encerrada','finalizada','inativa','0','false'].includes((linfo.statusLinha||'').toLowerCase());
            const cls=on?'vl-on':'vl-off';
            const stLabel=linfo.statusLinha||'';
            return `<div class="vi-linha-wrap ${cls}"><span class="vi-linha-nome">🚌 ${linfo.nomeLinha}</span>${stLabel?`<span class="vi-linha-st">${stLabel}</span>`:''}</div>`;
          })()
        : '';
      el.innerHTML=`
        <div class="vi-icon" style="background:transparent;border:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">${sidebarCircleIcon(ST_COLOR[st],32)}</div>
        <div class="vi-info">
          <div class="vi-name">${v.frota}</div>
          <div class="vi-sub">${v.motorista}</div>
          ${lBadge}
        </div>
        <div class="vi-right">
          <div class="vi-spd">${v.velocidade}<span class="vi-spd-u"> km/h</span></div>
          <div class="vi-badge ${bc[st]}">${bt[st]}</div>
        </div>
      `;
      el.onclick=()=>selectVehicle(v,false);
      b.appendChild(el);
    });
  }

  renderGroup(green,'Ligados');
  renderGroup(yellow,'Desligados');
  renderGroup(dark,'Offline');
  updateBadge();
  renderMkrs(activeV?activeV.id:null);
}

/* ── POSITION CARD ── */
function positionCard(v){
  const card=document.getElementById('iCard');
  const rect=document.getElementById('mapArea').getBoundingClientRect();
  const pt=mapL.latLngToContainerPoint([v.lat,v.lng]);
  const cW=260,cH=215,aH=8;
  let left=pt.x-cW/2,top=pt.y-cH-aH-6;
  left=Math.max(8,Math.min(left,rect.width-cW-8));
  top=Math.max(8,Math.min(top,rect.height-cH-40));
  const st=getStatus(v);
  const SC={green:{stripe:'ic-stripe-g',sbar:'isb-g',txt:'Ligado'},yellow:{stripe:'ic-stripe-y',sbar:'isb-y',txt:'Desligado'},dark:{stripe:'ic-stripe-d',sbar:'isb-d',txt:'Offline'}};
  const VC={green:'vg',yellow:'vy',dark:'vd'};const sc=SC[st];
  document.getElementById('icStripe').className='ic-stripe '+sc.stripe;
  document.getElementById('icFrota').textContent=v.frota;
  document.getElementById('icMoto').textContent='👤 '+v.motorista;
  document.getElementById('icDt').textContent=fmtDt(v.datahora);
  const vel=document.getElementById('icVel');vel.textContent=v.velocidade+' km/h';vel.className='icf-v '+VC[st];
  document.getElementById('icHodo').textContent=v.hodometro!=='—'?v.hodometro+' km':v.hodometro;
  const sb=document.getElementById('icSbar');sb.className='ic-sbar '+sc.sbar;
  document.getElementById('icStxt').textContent=sc.txt;
  // Linha (API2)
  const linhaInfo=linhaMap[v.frota]||null;
  const linhaRow=document.getElementById('icLinhaRow');
  if(linhaInfo&&linhaInfo.nomeLinha){
    const isOn=linhaInfo.statusLinha&&!['encerrada','finalizada','inativa','0','false'].includes(linhaInfo.statusLinha.toLowerCase());
    document.getElementById('icLinhaDot').style.background=isOn?'#00d46a':'#5a7a8a';
    document.getElementById('icLinhaNome').textContent='🚌 '+linhaInfo.nomeLinha;
    const stEl=document.getElementById('icLinhaSt');
    stEl.textContent=linhaInfo.statusLinha||'—';
    stEl.className='ic-linha-st '+(isOn?'icls-on':'icls-off');
    linhaRow.style.display='flex';
  }else{
    linhaRow.style.display='none';
  }
  if(window.innerWidth>700){
    card.style.left=left+'px';card.style.top=top+'px';
  } else {
    card.style.left='';card.style.top='';
  }
  card.classList.add('vis');
  // Reposiciona após animação de voo — apenas uma vez, apenas desktop, só se card ainda visível
  if(window.innerWidth>700){
    mapL.once('moveend',()=>{
      if(activeV && activeV===v && card.classList.contains('vis')) positionCard(v);
    });
  }
}

/* ── LOAD API2 (linhas) ── */
async function loadLinhas(){
  // Respeita cache de 5 minutos: evita chamadas desnecessárias à API de linhas
  const now = Date.now();
  if (linhasCacheTs > 0 && (now - linhasCacheTs) < LINHAS_CACHE_TTL) {
    console.log('[UniTrack] linhas: usando cache ('+Math.round((LINHAS_CACHE_TTL-(now-linhasCacheTs))/1000)+'s restantes)');
    return;
  }
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch(apiUrl(API2),{
      cache:'no-store',
      signal:ctrl.signal,
      headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}
    });
    clearTimeout(tid);
    if(!r.ok)return;
    const raw=await r.json();

    // Debug: loga o primeiro item da API2
    let arr=null;
    if(Array.isArray(raw))arr=raw;
    else{
      for(const k of['viagens','viagem','linhas','data','result','results','items','list']){
        if(Array.isArray(raw[k])){arr=raw[k];break;}
      }
      if(!arr)arr=Object.values(raw).find(v=>Array.isArray(v))||[];
    }
    if(arr.length>0){
      console.log('[UniTrack] API2 campos do 1o item:', JSON.stringify(arr[0]));
    }

    // Função auxiliar para pegar primeiro campo existente
    function pickL(obj, keys){
      for(var i=0;i<keys.length;i++){
        var v=obj[keys[i]];
        if(v!==undefined&&v!==null&&String(v).trim()!='') return String(v).trim();
      }
      return '';
    }

    const map={};
    arr.forEach(function(item){
      // Código do veículo — todos os nomes possíveis
      const cod=pickL(item,[
        'frota','placa','veiculo','veiculo_id','prefixo','codigo',
        'codigoVeiculo','codigo_veiculo','codVeiculo','CodigoVeiculo',
        'código do veículo','codigo do veiculo','Frota','Placa',
        'vei','VEI','cod_veiculo','idVeiculo'
      ]);

      // Nome da linha — todos os nomes possíveis
      const nome=pickL(item,[
        'nomeLinha','nome_linha','linha','descricao','nome','NomeLinha',
        'Linha','LINHA','nome_servico','servico','itinerario','rota',
        'destino','origem_destino','linha_descricao','linhaDescricao',
        'trajetoria','trajeto','linha_nome','nome_linha_completo'
      ]);

      // Status da viagem
      const st=pickL(item,[
        'status','situacao','Status','Situacao','situacao_viagem',
        'status_viagem','statusViagem','ativo','andamento','em_andamento'
      ]);

      if(cod && nome) map[cod]={nomeLinha:nome, statusLinha:st};
    });
    linhaMap=map;
    linhasCacheTs = Date.now();
    console.log('[UniTrack] linhaMap entries:', Object.keys(map).length, 'sample:', JSON.stringify(Object.entries(map).slice(0,2)));
    if(allV.length) renderList();
  }catch(e){
    console.warn('[UniTrack] API2 linhas falhou:',e);
  }
}

/* ── LOAD ── */
async function load(){
  // Não atualiza se o app estiver em segundo plano
  if(!pageVisible){ cd=0; return; }
  const btn=document.getElementById('btnR');btn.classList.add('sp');
  if(allV.length===0)document.getElementById('ovL').classList.remove('hidden');
  try{
    // Inicia API2 sem bloquear — em iOS/Safari HTTP pode ser bloqueado
    const linhasPromise = loadLinhas().catch(()=>{});

    // Fetch principal com timeout de 15s para compatibilidade iOS
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),15000);
    const r = await fetch(apiUrl(API),{
      cache:'no-store',
      signal:ctrl.signal,
      headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}
    });
    clearTimeout(tid);

    // Aguarda linhas com timeout adicional de 5s
    await Promise.race([linhasPromise, new Promise(res=>setTimeout(res,5000))]);

    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const raw=await r.json();
    let arr=null;
    if(Array.isArray(raw))arr=raw;
    else{
      for(const k of['posicao','posicoes','veiculos','data','result','results','items','list','frota']){
        if(Array.isArray(raw[k])){arr=raw[k];break;}
      }
      if(!arr)arr=Object.values(raw).find(v=>Array.isArray(v))||[];
    }
    // Salva posição anterior (para interpolação) e atualiza rastro (para trail)
    allV.forEach(v=>{
      const id=String(v.id);
      const ts=parseData(v.datahora);
      // _prevPos: posição atual vira "anterior" antes do allV ser sobrescrito
      _prevPos[id]={lat:v.lat, lng:v.lng, ts:ts?ts.getTime():Date.now()};
      // _trailPos: guarda últimas 2 posições distintas por veículo
      if(!_trailPos[id]) _trailPos[id]=[];
      const last=_trailPos[id][_trailPos[id].length-1];
      if(!last || last.lat!==v.lat || last.lng!==v.lng){
        _trailPos[id].push({lat:v.lat, lng:v.lng});
        if(_trailPos[id].length>2) _trailPos[id].shift(); // máx 2
      }
    });

    allV=norm(arr);
    filt=[...allV];

    renderList();
    if(!activeV){
      fitAll();
    } else {
      // Veículo selecionado: atualiza dados, interpolação e rastro
      const fresh=allV.find(v=>String(v.id)===String(activeV.id));
      if(fresh){
        // Captura posição visual ATUAL do marcador (pode estar no meio da animação)
        // para animar a partir daí sem saltar de volta para posição anterior
        const mk=mkrs[activeV.id];
        let fromLat=activeV.lat, fromLng=activeV.lng;
        if(mk){
          const latlng=mk.getLatLng();
          fromLat=latlng.lat; fromLng=latlng.lng;
        }
        activeV=fresh;
        if(mk){
          stopInterp();
          if(getStatus(fresh)==='green'){
            const moved=_haversineKm(fromLat,fromLng,fresh.lat,fresh.lng)>=0.03;
            if(moved){
              startInterp(mk, fromLat, fromLng, fresh.lat, fresh.lng, _INTERP_MS);
            } else {
              mk.setLatLng([fresh.lat, fresh.lng]);
            }
          } else {
            mk.setLatLng([fresh.lat, fresh.lng]);
          }
        }
        // rastro gerenciado pelo startInterp via startTrail
        const card=document.getElementById('iCard');
        if(card.classList.contains('vis')) positionCard(fresh);
      }
    }
    document.getElementById('ovL').classList.add('hidden');
    document.getElementById('ovE').classList.add('hidden');
  }catch(e){
    document.getElementById('ovL').classList.add('hidden');
    if(allV.length===0){
      document.getElementById('ovE').classList.remove('hidden');
      document.getElementById('erMsg').textContent=e.message||'Falha ao conectar.';
    }
    console.error('[UniTrack]',e);
  }finally{
    btn.classList.remove('sp');startCd();
  }
}

/* ── SIDEBAR DESKTOP TOGGLE ── */
function toggleSidebarDesktop(){
  if(isMobile()){ toggleSidebar(); return; }
  const sb=document.getElementById('mainSidebar');
  if(sb.classList.contains('sb-hidden')){
    sb.classList.remove('sb-hidden');
    setTimeout(()=>{ if(mapL) mapL.invalidateSize(); },280);
  } else {
    sb.classList.add('sb-hidden');
    setTimeout(()=>{ if(mapL) mapL.invalidateSize(); },280);
  }
}

/* ── SETA FLUTUANTE MOBILE ── */
function toggleFloatMenu(){
  const btn=document.getElementById('btnFloatMenu');
  const sb=document.querySelector('.sidebar');
  if(sb.classList.contains('open')){
    closeSidebar();
    btn.classList.remove('open');
  } else {
    openSidebar();
    btn.classList.add('open');
  }
}

/* ── SIDEBAR MOBILE CONTROLS ── */
function isMobile(){return window.innerWidth<=700;}
function toggleSidebar(){
  const sb=document.querySelector('.sidebar');
  if(sb.classList.contains('open')) closeSidebar();
  else openSidebar();
}
function openSidebar(){
  document.querySelector('.sidebar').classList.add('open');
  document.getElementById('sbOverlay').classList.add('vis');
  const fb=document.getElementById('btnFloatMenu');
  if(fb){fb.classList.add('open');}
}
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sbOverlay').classList.remove('vis');
  const fb=document.getElementById('btnFloatMenu');
  if(fb){fb.classList.remove('open');}
}
function closeSidebarIfMobile(){ if(isMobile()) closeSidebar(); }
function updateCardMode(){
  const h=document.querySelector('.ic-handle');
  if(h) h.style.display=isMobile()?'block':'none';
}
window.addEventListener('resize',updateCardMode);
updateCardMode();

initMap();
setTimeout(load,300);
</script>

<script>
var _pwaPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();_pwaPrompt=e;
  if(!sessionStorage.getItem('pwa_dismissed')){
    setTimeout(function(){
      var b=document.getElementById('pwaInstallBanner');
      if(b)b.style.display='flex';
    },3000);
  }
});
function pwaInstallNow(){
  document.getElementById('pwaInstallBanner').style.display='none';
  if(_pwaPrompt){_pwaPrompt.prompt();_pwaPrompt.userChoice.then(function(){_pwaPrompt=null;});}
}
function pwaInstallDismiss(){
  document.getElementById('pwaInstallBanner').style.display='none';
  sessionStorage.setItem('pwa_dismissed','1');
}
window.addEventListener('appinstalled',function(){
  document.getElementById('pwaInstallBanner').style.display='none';
  _pwaPrompt=null;
});
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js')
      .then(function(r){console.log('[SW] OK:',r.scope);})
      .catch(function(e){console.warn('[SW] Falha:',e);});
  });
}
</script>
